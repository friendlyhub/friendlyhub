# FriendlyHub Submissions — PR Validation
# Validates manifest + metainfo when a PR is opened or updated.

name: Validate Submission

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/recheck'))

    steps:
      - name: Get PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUMBER="${{ github.event.issue.number }}"
            SHA=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} --jq '.head.sha')
            AUTHOR=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} --jq '.user.login')
          else
            SHA="${{ github.event.pull_request.head.sha }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            AUTHOR="${{ github.event.pull_request.user.login }}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "author=${AUTHOR}" >> "$GITHUB_OUTPUT"

      # The PR head is untrusted fork code and this job is privileged -- it holds
      # pull-requests: write and the webhook secret. So the head is never checked
      # out; actions/checkout v7 refuses that under pull_request_target and the
      # refusal is correct. Only the files under validation are pulled in, as
      # data, under names we pick. The head commit is reachable from this repo via
      # refs/pull/N/head while the PR is open, so the contents API resolves paths
      # at the head SHA without involving the fork.
      - name: Fetch submission files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          mkdir -p work

          CHANGED_DIRS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[].filename | select(contains("/"))' | cut -d'/' -f1 | sort -u)
          DIR_COUNT=$(echo "${CHANGED_DIRS}" | grep -c . || true)

          if [ "${DIR_COUNT}" -eq 0 ]; then
            echo "::error::No app directory found in changed files"
            exit 1
          fi

          if [ "${DIR_COUNT}" -gt 1 ]; then
            echo "::error::PR must only modify a single app directory. Found: ${CHANGED_DIRS}"
            exit 1
          fi

          APP_DIR="${CHANGED_DIRS}"

          # Validate reverse-DNS format
          if ! echo "${APP_DIR}" | grep -qE '^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*){2,}$'; then
            echo "::error::Directory '${APP_DIR}' is not a valid reverse-DNS app ID"
            exit 1
          fi

          # Entry names come from the PR, so drop any that could alter the request
          # URL they are about to be interpolated into.
          ENTRIES=$(gh api "repos/${REPO}/contents/${APP_DIR}?ref=${HEAD_SHA}" \
            --jq '.[] | select(.type == "file") | .name' | grep -E '^[A-Za-z0-9._-]+$' || true)

          MANIFEST=""
          MANIFEST_EXT=""
          for ext in json yaml yml; do
            for name in $(echo "${ENTRIES}" | grep -E "\.${ext}$" | sort); do
              gh api "repos/${REPO}/contents/${APP_DIR}/${name}?ref=${HEAD_SHA}" \
                -H "Accept: application/vnd.github.raw" > work/candidate || continue
              if grep -qE '"app-id"|"id"|app-id:|^id:' work/candidate; then
                MANIFEST="${name}"
                MANIFEST_EXT="${ext}"
                mv work/candidate "work/manifest.${ext}"
                break 2
              fi
            done
          done

          if [ -z "${MANIFEST}" ]; then
            echo "::error::No Flatpak manifest found in ${APP_DIR}/"
            exit 1
          fi

          METAINFO="${APP_DIR}/${APP_DIR}.metainfo.xml"
          if ! gh api "repos/${REPO}/contents/${METAINFO}?ref=${HEAD_SHA}" \
               -H "Accept: application/vnd.github.raw" > work/metainfo.xml; then
            echo "::error::Missing metainfo file: ${METAINFO}"
            exit 1
          fi

          echo "app_dir=${APP_DIR}" >> "$GITHUB_OUTPUT"
          echo "manifest_name=${MANIFEST}" >> "$GITHUB_OUTPUT"
          echo "manifest_ext=${MANIFEST_EXT}" >> "$GITHUB_OUTPUT"
          echo "Detected app: ${APP_DIR}"
          echo "  Manifest: ${APP_DIR}/${MANIFEST}"
          echo "  Metainfo: ${METAINFO}"

      - name: Validate manifest
        env:
          FRIENDLYHUB_API_URL: ${{ secrets.FRIENDLYHUB_API_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          MANIFEST_EXT: ${{ steps.detect.outputs.manifest_ext }}
        run: |
          MANIFEST="work/manifest.${MANIFEST_EXT}"

          if [ "${MANIFEST_EXT}" != "json" ]; then
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
            MANIFEST_JSON=$(yq -o=json '.' "${MANIFEST}")
          else
            MANIFEST_JSON=$(cat "${MANIFEST}")
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${FRIENDLYHUB_API_URL}/api/v1/manifests/validate" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${WEBHOOK_SECRET}" \
            -d "${MANIFEST_JSON}")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          echo "Manifest validation (${HTTP_CODE}):"
          echo "${BODY}" | jq . 2>/dev/null || echo "${BODY}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Manifest validation request failed"
            exit 1
          fi

          VALID=$(echo "${BODY}" | jq -r '.valid')
          if [ "${VALID}" != "true" ]; then
            echo "${BODY}" | jq -r '.errors[]' | while read -r err; do
              echo "::error::${err}"
            done
            exit 1
          fi

          echo "${BODY}" | jq -r '.warnings[]' 2>/dev/null | while read -r warn; do
            echo "::warning::${warn}"
          done

      # The merge step sends every file in the app directory, so anything the
      # manifest needs has to be there, and every name has to be one the API
      # accepts. Otherwise the PR merges and only then fails.
      - name: Check companion files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          APP_DIR: ${{ steps.detect.outputs.app_dir }}
          MANIFEST_NAME: ${{ steps.detect.outputs.manifest_name }}
          MANIFEST_EXT: ${{ steps.detect.outputs.manifest_ext }}
        run: |
          to_json() {
            case "$1" in
              *.yaml|*.yml)
                if ! command -v yq >/dev/null; then
                  sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
                  sudo chmod +x /usr/local/bin/yq
                fi
                yq -o=json '.' "$2" ;;
              *) cat "$2" ;;
            esac
          }

          # Every file in the app directory at the PR head, by path relative to it
          ROOT_TREE=$(gh api "repos/${REPO}/git/commits/${HEAD_SHA}" --jq '.tree.sha')
          DIR_TREE=$(gh api "repos/${REPO}/git/trees/${ROOT_TREE}" --jq ".tree[] | select(.path == \"${APP_DIR}\") | .sha")
          gh api "repos/${REPO}/git/trees/${DIR_TREE}?recursive=1" \
            --jq '[.tree[] | select(.type == "blob") | .path]' > work/present.json

          # What a manifest or module needs beside it, by the same rules as
          # getExternalSourceFiles in the web app's submit form: included module
          # and sources files, and the local files of file, patch and archive
          # sources, each relative to the file that names it.
          cat > work/companions.jq <<'EOF'
          def resolve($dir):
            ($dir + "/" + .) | split("/") | map(select(. != "" and . != "."))
            | reduce .[] as $part ([]; if $part == ".." and length > 0 and .[-1] != ".." then .[:-1] else . + [$part] end)
            | join("/");
          def is_local: type == "string" and (startswith("/") | not) and (contains("://") | not);
          def needs($dir):
            ((.sources // [])[]? |
              if type == "string" then select(is_local) | {path: resolve($dir), module: false}
              elif type == "object" then
                ((select(.type == "file" or .type == "patch" or .type == "archive") | .path),
                 (select(.type == "patch") | .paths[]?))
                | select(is_local) | {path: resolve($dir), module: false}
              else empty end),
            ((.modules // [])[]? |
              if type == "string" then select(is_local) | {path: resolve($dir), module: true}
              elif type == "object" then needs($dir)
              else empty end);
          if type == "object" then [needs($dir)] else [] end
          EOF

          to_json "manifest.${MANIFEST_EXT}" "work/manifest.${MANIFEST_EXT}" > work/manifest-data.json
          jq --arg dir '' -f work/companions.jq work/manifest-data.json > work/needed.json

          # Each part as the API accepts it: no leading dot, so no hidden files and no ..
          SAFE_PATH='\A[A-Za-z0-9_+-][A-Za-z0-9._+-]*(/[A-Za-z0-9_+-][A-Za-z0-9._+-]*)*\z'

          # An included module file can name further files, relative to itself.
          # Only paths that exist in the PR and pass SAFE_PATH reach a request URL.
          : > work/walked.txt
          while :; do
            mapfile -t TODO < <(jq -r --slurpfile present work/present.json \
              --rawfile walked work/walked.txt --arg safe "${SAFE_PATH}" '
              ($walked | split("\n")) as $w
              | .[] | select(.module) | .path
              | select(test($safe) and IN($present[0][]) and (IN($w[]) | not)
                       and (startswith("shared-modules/") | not))' work/needed.json)
            [ "${#TODO[@]}" -eq 0 ] && break
            for m in "${TODO[@]}"; do
              echo "${m}" >> work/walked.txt
              DIR="${m%/*}"
              [ "${DIR}" = "${m}" ] && DIR=""
              gh api "repos/${REPO}/contents/${APP_DIR}/${m}?ref=${HEAD_SHA}" \
                -H "Accept: application/vnd.github.raw" > work/module
              if ! to_json "${m}" work/module > work/module.json \
                 || ! jq --arg dir "${DIR}" -f work/companions.jq work/module.json > work/more.json; then
                echo "::error::${APP_DIR}/${m} is not a valid module file"
                exit 1
              fi
              jq -s 'add | unique_by(.path)' work/needed.json work/more.json > work/merged.json
              mv work/merged.json work/needed.json
            done
          done

          # Names come from the PR, so each is printed JSON-encoded
          jq -r --slurpfile present work/present.json --arg metainfo "${APP_DIR}.metainfo.xml" '
            .[] | .path
            | select((startswith("shared-modules/") or . == $metainfo) | not)
            | if startswith("../") then "\(tojson) is outside the app directory, so it cannot be submitted"
              elif test("(\\A|/)\\.") then "\(tojson) is hidden, and hidden files are not submitted"
              elif (IN($present[0][]) | not) then "The manifest needs \(tojson), which is not in the app directory"
              else empty end' work/needed.json > work/errors.txt

          jq -r --arg manifest "${MANIFEST_NAME}" --arg metainfo "${APP_DIR}.metainfo.xml" \
            --arg server_manifest "${APP_DIR}.json" --arg safe "${SAFE_PATH}" '
            .[]
            | select((test("(\\A|/)\\.") or startswith("shared-modules/") or . == $manifest or . == $metainfo) | not)
            | if . == $server_manifest then "\(tojson) would replace the manifest that FriendlyHub writes"
              elif (test($safe) | not) then "\(tojson) cannot be submitted: names may only use letters, digits, ., _, + and -"
              else empty end' work/present.json >> work/errors.txt

          if [ -s work/errors.txt ]; then
            while IFS= read -r err; do
              echo "::error::${err}"
            done < work/errors.txt
            exit 1
          fi
          echo "Companion files: $(jq -r 'map(.path | tojson) | join(", ")' work/needed.json)"

      - name: Validate metainfo
        env:
          FRIENDLYHUB_API_URL: ${{ secrets.FRIENDLYHUB_API_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          METAINFO_CONTENT=$(jq -Rs '.' work/metainfo.xml)

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${FRIENDLYHUB_API_URL}/api/v1/webhooks/validate-metainfo" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${WEBHOOK_SECRET}" \
            -d "{\"metainfo\": ${METAINFO_CONTENT}}")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          echo "Metainfo validation (${HTTP_CODE}):"
          echo "${BODY}" | jq . 2>/dev/null || echo "${BODY}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Metainfo validation request failed"
            exit 1
          fi

          VALID=$(echo "${BODY}" | jq -r '.valid')
          if [ "${VALID}" != "true" ]; then
            echo "${BODY}" | jq -r '.errors[]' | while read -r err; do
              echo "::error::${err}"
            done
            exit 1
          fi

          VERSION=$(echo "${BODY}" | jq -r '.version // empty')
          if [ -z "${VERSION}" ]; then
            echo "::error::Metainfo must contain at least one <release> with a version"
            exit 1
          fi

          echo "${BODY}" | jq -r '.warnings[]' 2>/dev/null | while read -r warn; do
            echo "::warning::${warn}"
          done

          APP_ID=$(echo "${BODY}" | jq -r '.app_id // empty')
          echo ""
          echo "App ID: ${APP_ID}"
          echo "Version: ${VERSION}"
          echo "Validation passed."

      - name: Check domain verification
        id: verification
        env:
          FRIENDLYHUB_API_URL: ${{ secrets.FRIENDLYHUB_API_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          APP_DIR="${{ steps.detect.outputs.app_dir }}"
          PR_AUTHOR="${{ steps.pr.outputs.author }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${FRIENDLYHUB_API_URL}/api/v1/webhooks/check-verification" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${WEBHOOK_SECRET}" \
            -d "{\"app_id\": \"${APP_DIR}\", \"github_username\": \"${PR_AUTHOR}\"}")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          echo "Verification check (${HTTP_CODE}):"
          echo "${BODY}" | jq . 2>/dev/null || echo "${BODY}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::warning::Verification check failed (non-blocking)"
            echo "verified=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERIFIED=$(echo "${BODY}" | jq -r '.verified')
          echo "verified=${VERIFIED}" >> "$GITHUB_OUTPUT"

          if [ "${VERIFIED}" = "false" ]; then
            DOMAIN=$(echo "${BODY}" | jq -r '.domain // empty')
            TOKEN=$(echo "${BODY}" | jq -r '.token // empty')
            WELL_KNOWN_URL=$(echo "${BODY}" | jq -r '.well_known_url // empty')
            echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"
            echo "well_known_url=${WELL_KNOWN_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR if domain unverified
        if: steps.verification.outputs.verified == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const domain = '${{ steps.verification.outputs.domain }}';
            const token = '${{ steps.verification.outputs.token }}';
            const wellKnownUrl = '${{ steps.verification.outputs.well_known_url }}';

            const marker = '<!-- friendlyhub-verification -->';
            const body = `${marker}
            ### Domain verification required

            Your app ID uses the domain **${domain}**, which has not been verified yet.

            To verify ownership, create the following file on your web server:

            **URL:** \`${wellKnownUrl}\`
            **Contents:** add this token on its own line:
            \`\`\`
            ${token}
            \`\`\`

            Once the file is accessible, comment \`/recheck\` on this PR to verify automatically.

            > Your app can still be merged without verification, but it will show as **unverified** on FriendlyHub until the domain is confirmed.`;

            const prNumber = ${{ steps.pr.outputs.number }};

            // Delete previous verification comments to avoid spam
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            for (const comment of comments.data) {
              if (comment.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body,
            });

      - name: Clean up verification comment if verified
        if: steps.verification.outputs.verified == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- friendlyhub-verification -->';
            const prNumber = ${{ steps.pr.outputs.number }};

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            for (const comment of comments.data) {
              if (comment.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: 'Domain verified successfully.',
            });
