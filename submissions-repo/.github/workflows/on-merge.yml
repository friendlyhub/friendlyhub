# FriendlyHub Submissions — Process Merged Submission
# When a PR is merged, creates the app + submission in FriendlyHub and triggers a build.

name: Process Submission

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  submit:
    name: Submit to FriendlyHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changed app directory
        id: detect
        run: |
          # Find directories changed in the merge commit. A push that touches no
          # app directory leaves grep with no match, which must not fail the step.
          CHANGED_DIRS=$(git diff --name-only HEAD~1...HEAD | grep '/' | cut -d'/' -f1 | sort -u | grep -v '^\.' || true)
          DIR_COUNT=$(echo "${CHANGED_DIRS}" | grep -c . || true)

          if [ "${DIR_COUNT}" -eq 0 ]; then
            echo "No app directories changed, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Process the first changed directory (PRs should only contain one)
          APP_DIR=$(echo "${CHANGED_DIRS}" | head -1)

          # Find manifest
          MANIFEST=""
          for f in "${APP_DIR}"/*.json "${APP_DIR}"/*.yaml "${APP_DIR}"/*.yml; do
            if [ -f "$f" ] && grep -qE '"app-id"|"id"|app-id:|^id:' "$f" 2>/dev/null; then
              MANIFEST="$f"
              break
            fi
          done

          if [ -z "${MANIFEST}" ]; then
            echo "::error::No manifest found in ${APP_DIR}/"
            exit 1
          fi

          METAINFO="${APP_DIR}/${APP_DIR}.metainfo.xml"
          if [ ! -f "${METAINFO}" ]; then
            echo "::error::Missing metainfo: ${METAINFO}"
            exit 1
          fi

          echo "app_dir=${APP_DIR}" >> "$GITHUB_OUTPUT"
          echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"
          echo "metainfo=${METAINFO}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Determine PR author
        id: author
        if: steps.detect.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the PR that was merged for this commit
          AUTHOR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].user.login // empty' 2>/dev/null || true)

          if [ -z "${AUTHOR}" ]; then
            # Try searching by merge commit SHA
            AUTHOR=$(gh pr list --state merged --search "${{ github.sha }}" --json author --limit 1 \
              --jq '.[0].author.login // empty' 2>/dev/null || true)
          fi

          if [ -z "${AUTHOR}" ]; then
            # Fall back to commit author GitHub login
            AUTHOR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" \
              --jq '.author.login // empty' 2>/dev/null || true)
          fi

          if [ -z "${AUTHOR}" ]; then
            echo "::error::Could not determine PR author"
            exit 1
          fi

          echo "github_username=${AUTHOR}" >> "$GITHUB_OUTPUT"
          echo "PR author: ${AUTHOR}"

      - name: Submit to FriendlyHub
        if: steps.detect.outputs.skip != 'true'
        env:
          FRIENDLYHUB_API_URL: ${{ secrets.FRIENDLYHUB_API_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          APP_DIR="${{ steps.detect.outputs.app_dir }}"
          MANIFEST="${{ steps.detect.outputs.manifest }}"
          METAINFO="${{ steps.detect.outputs.metainfo }}"
          GITHUB_USERNAME="${{ steps.author.outputs.github_username }}"

          # File contents travel through files, never arguments: a single
          # argument is capped at 128 KB, which cargo-sources.json often exceeds.
          WORK="${RUNNER_TEMP}/submission"
          mkdir -p "${WORK}"

          # Convert manifest to JSON if needed
          if [[ "${MANIFEST}" == *.yaml ]] || [[ "${MANIFEST}" == *.yml ]]; then
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
            yq -o=json '.' "${MANIFEST}" > "${WORK}/manifest.json"
          else
            cp "${MANIFEST}" "${WORK}/manifest.json"
          fi

          # Collect companion files: everything in the app directory except the
          # manifest and metainfo, by path relative to it, since that is where
          # the manifest looks for them. Valid UTF-8 goes as text, anything else
          # (icons, archives) as base64. Hidden files can't be submitted, and the
          # build fetches shared-modules/ itself.
          echo '{}' > "${WORK}/source_files.json"
          while IFS= read -r -d '' f; do
            REL="${f#"${APP_DIR}"/}"
            if iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              jq --arg k "${REL}" --rawfile v "$f" '. + {($k): $v}' \
                "${WORK}/source_files.json" > "${WORK}/next.json"
            else
              base64 -w0 "$f" > "${WORK}/content.b64"
              jq --arg k "${REL}" --rawfile v "${WORK}/content.b64" '. + {($k): {base64: $v}}' \
                "${WORK}/source_files.json" > "${WORK}/next.json"
            fi
            mv "${WORK}/next.json" "${WORK}/source_files.json"
          done < <(find "${APP_DIR}" -type f ! -path "${MANIFEST}" ! -path "${METAINFO}" \
                     ! -path '*/.*' ! -path "${APP_DIR}/shared-modules/*" -print0)

          # Call pr-submit endpoint
          jq -n \
            --arg app_id "${APP_DIR}" \
            --slurpfile manifest "${WORK}/manifest.json" \
            --rawfile metainfo "${METAINFO}" \
            --arg github_username "${GITHUB_USERNAME}" \
            --slurpfile source_files "${WORK}/source_files.json" \
            '{
              app_id: $app_id,
              manifest: $manifest[0],
              metainfo: $metainfo,
              github_username: $github_username,
              source_files: $source_files[0]
            }' > "${WORK}/payload.json"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${FRIENDLYHUB_API_URL}/api/v1/webhooks/pr-submit" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${WEBHOOK_SECRET}" \
            --data-binary "@${WORK}/payload.json")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          echo "Submission response (${HTTP_CODE}):"
          echo "${BODY}" | jq . 2>/dev/null || echo "${BODY}"

          if [ "${HTTP_CODE}" != "200" ] && [ "${HTTP_CODE}" != "201" ]; then
            echo "::error::Failed to create submission"
            exit 1
          fi

          SUBMISSION_ID=$(echo "${BODY}" | jq -r '.id')
          VERSION=$(echo "${BODY}" | jq -r '.version')
          echo "Submission created: ${SUBMISSION_ID} (v${VERSION})"
          echo "Build has been triggered."

      - name: Clean up submission directory
        if: always() && steps.detect.outputs.skip != 'true' && steps.detect.outputs.app_dir != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_DIR="${{ steps.detect.outputs.app_dir }}"
          echo "Removing ${APP_DIR}/ from submissions repo..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r "${APP_DIR}"
          git commit -m "Clean up ${APP_DIR} after app repo created"
          git push
