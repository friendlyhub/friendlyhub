# FriendlyHub Build Workflow
# This workflow is placed in each app's repo under .github/workflows/build.yml
# It can be triggered by workflow_dispatch from the FriendlyHub API.
#
# The workflow builds the Flatpak, uploads it to flat-manager, and notifies
# the FriendlyHub API via webhook.

name: Build Flatpak

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: "FriendlyHub submission UUID"
        required: true
        type: string
      app_id:
        description: "Flatpak app ID (e.g. org.example.App)"
        required: true
        type: string
      manifest_path:
        description: "Path to the manifest file"
        required: false
        type: string
        default: ""
      arch:
        description: "Target architecture (x86_64 or aarch64)"
        required: true
        type: string
        default: "x86_64"

# Each arch is dispatched as its own run, so without this they overlap. flat-manager writes
# uploads synchronously on its actix worker threads, so a builder arriving mid-upload can have
# its request head sit unread past actix's 5s timeout and come back as a bare 408. Serialising
# per app keeps the two upload phases apart. Never cancel-in-progress -- that would kill the
# arch that is already uploading.
concurrency:
  group: friendlyhub-build-${{ inputs.app_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub-hosted runners ship with ~30 GB of preinstalled tooling we never
      # use (Android SDK, .NET, GHC, CodeQL). Reclaim it so the builder image plus
      # the Flatpak runtime/SDK installs have room -- x86_64 was running out here.
      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "After:"; df -h / | tail -1

      - name: Fetch shared-modules
        run: |
          if grep -rq 'shared-modules/' *.json *.yaml *.yml 2>/dev/null; then
            echo "Manifest references shared-modules, cloning..."
            git clone --depth=1 https://github.com/flathub/shared-modules.git shared-modules
          else
            echo "No shared-modules references found, skipping."
          fi

      - name: Detect manifest
        id: detect
        run: |
          # Use the provided manifest path, or auto-detect
          MANIFEST="${{ inputs.manifest_path }}"
          if [ -z "${MANIFEST}" ]; then
            # Look for common manifest filenames
            for f in *.json *.yaml *.yml; do
              if [ -f "$f" ] && grep -q '"app-id"\|"id"\|app-id:' "$f" 2>/dev/null; then
                MANIFEST="$f"
                break
              fi
            done
          fi

          if [ -z "${MANIFEST}" ] || [ ! -f "${MANIFEST}" ]; then
            echo "ERROR: No Flatpak manifest found"
            exit 1
          fi

          echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"

          # Extract app-id from manifest
          APP_ID="${{ inputs.app_id }}"
          if [ -z "${APP_ID}" ]; then
            # Try JSON
            APP_ID=$(jq -r '.["app-id"] // .id // empty' "${MANIFEST}" 2>/dev/null || true)
            # Try YAML if JSON failed
            if [ -z "${APP_ID}" ]; then
              APP_ID=$(grep -E '^(app-id|id):' "${MANIFEST}" | head -1 | sed 's/^[^:]*: *//' | tr -d '"' | tr -d "'")
            fi
          fi

          echo "app_id=${APP_ID}" >> "$GITHUB_OUTPUT"
          echo "Detected manifest: ${MANIFEST}"
          echo "Detected app-id: ${APP_ID}"

      # Run the builder image directly (not as a job-level container) so the
      # disk-cleanup step above runs on the host first. The checkout is mounted
      # at /workspace and used as the working dir, matching how the build script
      # resolves the manifest and shared-modules; /build/* stays the scratch area.
      - name: Build Flatpak
        env:
          MANIFEST_PATH: ${{ steps.detect.outputs.manifest }}
          APP_ID: ${{ steps.detect.outputs.app_id }}
          ARCH: ${{ inputs.arch }}
          FLAT_MANAGER_TOKEN: ${{ secrets.FLAT_MANAGER_TOKEN }}
          REPO_NAME: stable
          FRIENDLYHUB_API_URL: ${{ secrets.FRIENDLYHUB_API_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SUBMISSION_ID: ${{ inputs.submission_id || 'manual' }}
        run: |
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e MANIFEST_PATH -e APP_ID -e ARCH \
            -e FLAT_MANAGER_TOKEN -e REPO_NAME \
            -e FRIENDLYHUB_API_URL -e WEBHOOK_SECRET -e SUBMISSION_ID \
            -e GITHUB_SERVER_URL -e GITHUB_REPOSITORY -e GITHUB_RUN_ID \
            "ghcr.io/friendlyhub/flatpak-builder:${ARCH}"

      - name: Notify failure
        if: failure()
        env:
          FRIENDLYHUB_API_URL: ${{ secrets.FRIENDLYHUB_API_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          ARCH: ${{ inputs.arch }}
        run: |
          if [ -n "${SUBMISSION_ID}" ] && [ "${SUBMISSION_ID}" != "manual" ]; then
            GHA_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            curl -s -X POST "${FRIENDLYHUB_API_URL}/api/v1/webhooks/build-complete" \
              -H "Content-Type: application/json" \
              -H "x-webhook-secret: ${WEBHOOK_SECRET}" \
              -d "{
                \"submission_id\": \"${SUBMISSION_ID}\",
                \"result\": \"failure\",
                \"arch\": \"${ARCH}\",
                \"gha_run_id\": ${GITHUB_RUN_ID},
                \"gha_run_url\": \"${GHA_RUN_URL}\",
                \"build_log_url\": \"${GHA_RUN_URL}\"
              }"
          fi
